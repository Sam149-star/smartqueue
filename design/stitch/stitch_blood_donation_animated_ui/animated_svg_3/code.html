<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_10 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_10" style="display:block;"><svg class="vital-mascot-svg" height="100%" viewbox="0 0 520 480" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients & Highlights -->
<lineargradient id="dropGrad" x1="0.2" x2="0.8" y1="0" y2="1">
<stop offset="0%" stop-color="#ff3b56"></stop>
<stop offset="45%" stop-color="#e01a3f"></stop>
<stop offset="100%" stop-color="#a60824"></stop>
</lineargradient>
<radialgradient cx="50%" cy="50%" id="glowGrad" r="50%">
<stop offset="0%" stop-color="#ff4b6b" stop-opacity="0.45"></stop>
<stop offset="60%" stop-color="#ff2e4d" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#ff4b6b" stop-opacity="0"></stop>
</radialgradient>
<radialgradient cx="50%" cy="50%" id="cheekGrad" r="50%">
<stop offset="0%" stop-color="#ff6b8b" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#ff859d" stop-opacity="0"></stop>
</radialgradient>
<lineargradient id="signWood" x1="0" x2="1" y1="0" y2="0">
<stop offset="0%" stop-color="#9a6744"></stop>
<stop offset="50%" stop-color="#bd855c"></stop>
<stop offset="100%" stop-color="#8a5735"></stop>
</lineargradient>
<lineargradient id="signBoardGrad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#fff5f5"></stop>
</lineargradient>
<filter height="140%" id="signDropShadow" width="140%" x="-20%" y="-20%">
<fedropshadow dx="2" dy="5" flood-color="#550512" flood-opacity="0.3" stddeviation="4"></fedropshadow>
</filter>
<style>
      /* Varied multi-axis floating, sway & bobbing physics (6s compound cycle) */
      @keyframes variedFloat {
        0% { transform: translate(0px, 0px) rotate(0deg); }
        20% { transform: translate(6px, -16px) rotate(2deg); }
        40% { transform: translate(-6px, -24px) rotate(-2deg); }
        60% { transform: translate(5px, -12px) rotate(2.5deg); }
        80% { transform: translate(-4px, -20px) rotate(-1deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
      }

      /* Elastic squash and stretch with subtle organic breathing */
      @keyframes organicBreatheAndSquash {
        0%, 100% { transform: scale(1, 1); }
        25% { transform: scale(0.97, 1.03); }
        50% { transform: scale(1.03, 0.97); }
        75% { transform: scale(0.98, 1.02); }
      }

      /* Drop Tip playful wobble/droop lag */
      @keyframes tipWobble {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-4deg) skewX(-2deg); }
        70% { transform: rotate(4deg) skewX(2.5deg); }
      }

      /* Coordinated shadow expanding, contracting, and shifting with float */
      @keyframes variedShadow {
        0%, 100% { transform: translate(0px, 0px) scale(1, 1); opacity: 0.28; }
        20% { transform: translate(4px, 0px) scale(0.85, 0.85); opacity: 0.18; }
        40% { transform: translate(-4px, 0px) scale(0.74, 0.76); opacity: 0.13; }
        60% { transform: translate(5px, 0px) scale(0.88, 0.88); opacity: 0.20; }
        80% { transform: translate(-3px, 0px) scale(0.78, 0.80); opacity: 0.15; }
      }

      /* Cheerful waving left arm (waving hand to donors) */
      @keyframes waveHandLeft {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(-22deg) translate(-4px, -8px); }
        30% { transform: rotate(8deg) translate(3px, -2px); }
        45% { transform: rotate(-24deg) translate(-5px, -9px); }
        60% { transform: rotate(6deg) translate(2px, -1px); }
        75% { transform: rotate(-18deg) translate(-3px, -6px); }
        100% { transform: rotate(0deg); }
      }

      /* Vigorously waving right arm holding and swinging the "We Help !" sign board */
      @keyframes waveSignRightArm {
        0% { transform: rotate(0deg); }
        18% { transform: rotate(14deg) translateY(-8px); }
        36% { transform: rotate(-12deg) translateY(4px); }
        54% { transform: rotate(16deg) translateY(-10px); }
        72% { transform: rotate(-10deg) translateY(3px); }
        90% { transform: rotate(10deg) translateY(-5px); }
        100% { transform: rotate(0deg); }
      }

      /* Dynamic secondary wobble of the sign board on its stick */
      @keyframes signFlutter {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg) scale(1.02); }
        50% { transform: rotate(4deg) scale(0.99); }
        75% { transform: rotate(-3deg) scale(1.01); }
      }

      /* Little decorative red heart beating on the sign */
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        20% { transform: scale(1.25); }
        35% { transform: scale(1.05); }
        50% { transform: scale(1.2); }
      }

      /* Aura glow pulsation */
      @keyframes auraPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.45; }
        50% { transform: scale(1.12); opacity: 0.85; }
      }

      /* Sparkles */
      @keyframes sparkleTwinkle {
        0%, 100% { opacity: 0.15; transform: scale(0.5) rotate(0deg); }
        50% { opacity: 0.95; transform: scale(1.2) rotate(45deg); }
      }

      /* EYE & FACE ANIMATION (10s Master Timeline) */
      @keyframes zenEyesAnim {
        0%, 24% { opacity: 1; visibility: visible; }
        26%, 97% { opacity: 0; visibility: hidden; }
        98%, 100% { opacity: 1; visibility: visible; }
      }
      @keyframes naturalBlinkZen {
        0%, 10%, 14%, 24% { transform: scaleY(1); }
        12% { transform: scaleY(0.1); }
      }
      @keyframes happyOpenEyesAnim {
        0%, 25% { opacity: 0; visibility: hidden; }
        27%, 55% { opacity: 1; visibility: visible; }
        57%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes gazeShift {
        27%, 32% { transform: translate(0px, 0px); }
        36%, 44% { transform: translate(4px, -1px); }
        48%, 55% { transform: translate(-3px, -2px); }
      }
      @keyframes winkEyesAnim {
        0%, 56% { opacity: 0; visibility: hidden; }
        58%, 76% { opacity: 1; visibility: visible; }
        78%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes joyfulCrescentsAnim {
        0%, 77% { opacity: 0; visibility: hidden; }
        79%, 96% { opacity: 1; visibility: visible; }
        98%, 100% { opacity: 0; visibility: hidden; }
      }

      /* Dynamic Mouth expressions matching the eyes */
      @keyframes mouthExpressionShift {
        0%, 25% { d: path("M231 254 Q240 264 249 254"); }
        27%, 55% { d: path("M228 250 Q240 274 252 250 Z"); }
        58%, 76% { d: path("M230 252 Q242 265 254 251"); }
        79%, 96% { d: path("M227 251 Q240 270 253 251"); }
        98%, 100% { d: path("M231 254 Q240 264 249 254"); }
      }

      /* Blush pulse when smiling/winking */
      @keyframes blushPulse {
        0%, 25% { transform: scale(1); opacity: 0.75; }
        27%, 76% { transform: scale(1.2); opacity: 0.95; }
        78%, 100% { transform: scale(1); opacity: 0.75; }
      }

      /* Class bindings */
      .mascot-container {
        transform-origin: 240px 330px;
        animation: variedFloat 6s ease-in-out infinite;
      }
      .mascot-body-scale {
        transform-origin: 240px 250px;
        animation: organicBreatheAndSquash 6s ease-in-out infinite;
      }
      .mascot-shadow {
        transform-origin: 240px 425px;
        animation: variedShadow 6s ease-in-out infinite;
      }
      .drop-tip {
        transform-origin: 240px 140px;
        animation: tipWobble 5s ease-in-out infinite;
      }
      .arm-left-wave {
        transform-origin: 165px 255px;
        animation: waveHandLeft 2.4s ease-in-out infinite;
      }
      .arm-right-sign {
        transform-origin: 310px 260px;
        animation: waveSignRightArm 3s ease-in-out infinite;
      }
      .sign-flutter-group {
        transform-origin: 385px 190px;
        animation: signFlutter 3s ease-in-out infinite;
      }
      .sign-heart {
        transform-origin: 432px 142px;
        animation: heartBeat 1.8s ease-in-out infinite;
      }
      .pulse-aura {
        transform-origin: 240px 230px;
        animation: auraPulse 4s ease-in-out infinite;
      }
      .expr-zen {
        transform-origin: 240px 238px;
        animation: zenEyesAnim 10s infinite, naturalBlinkZen 10s infinite;
      }
      .expr-happy-open {
        animation: happyOpenEyesAnim 10s infinite;
      }
      .gaze-target {
        animation: gazeShift 10s ease-in-out infinite;
      }
      .expr-wink {
        animation: winkEyesAnim 10s infinite;
      }
      .expr-joyful-crescent {
        animation: joyfulCrescentsAnim 10s infinite;
      }
      .blush-cheeks {
        transform-origin: 240px 256px;
        animation: blushPulse 10s ease-in-out infinite;
      }
      .dynamic-mouth {
        animation: mouthExpressionShift 10s ease-in-out infinite;
      }

      .sparkle-1 {
        transform-origin: 110px 140px;
        animation: sparkleTwinkle 2.8s ease-in-out infinite;
      }
      .sparkle-2 {
        transform-origin: 460px 100px;
        animation: sparkleTwinkle 3.2s ease-in-out infinite 1.1s;
      }
      .sparkle-3 {
        transform-origin: 120px 310px;
        animation: sparkleTwinkle 2.5s ease-in-out infinite 0.6s;
      }
    </style>
</defs>
