<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_8 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_8" style="display:block;"><svg class="vital-mascot-svg" height="100%" viewbox="0 0 400 450" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients & Highlights -->
<lineargradient id="dropGrad" x1="0.2" x2="0.8" y1="0" y2="1">
<stop offset="0%" stop-color="#ff3b56"></stop>
<stop offset="45%" stop-color="#e01a3f"></stop>
<stop offset="100%" stop-color="#a60824"></stop>
</lineargradient>
<radialgradient cx="50%" cy="50%" id="glowGrad" r="50%">
<stop offset="0%" stop-color="#ff4b6b" stop-opacity="0.45"></stop>
<stop offset="60%" stop-color="#ff2e4d" stop-opacity="0.15"></stop>
<stop offset="100%" stop-color="#ff4b6b" stop-opacity="0"></stop>
</radialgradient>
<radialgradient cx="50%" cy="50%" id="cheekGrad" r="50%">
<stop offset="0%" stop-color="#ff6b8b" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#ff859d" stop-opacity="0"></stop>
</radialgradient>
<style>
    /* Varied multi-axis floating, sway & bobbing physics (8s compound cycle) */
    @keyframes variedFloat {
      0% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      18% {
        transform: translate(6px, -18px) rotate(2.5deg);
      }
      35% {
        transform: translate(-5px, -28px) rotate(-2deg);
      }
      52% {
        transform: translate(8px, -14px) rotate(3deg);
      }
      70% {
        transform: translate(-7px, -24px) rotate(-1.5deg);
      }
      88% {
        transform: translate(3px, -8px) rotate(1deg);
      }
      100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    /* Elastic squash and stretch with subtle organic breathing */
    @keyframes organicBreatheAndSquash {
      0%, 100% {
        transform: scale(1, 1);
      }
      18% {
        transform: scale(0.97, 1.03);
      }
      35% {
        transform: scale(1.04, 0.96);
      }
      52% {
        transform: scale(0.96, 1.04);
      }
      70% {
        transform: scale(1.03, 0.97);
      }
      88% {
        transform: scale(0.98, 1.02);
      }
    }

    /* Drop Tip playful wobble/droop lag */
    @keyframes tipWobble {
      0%, 100% {
        transform: rotate(0deg);
      }
      22% {
        transform: rotate(-4deg) skewX(-2deg);
      }
      50% {
        transform: rotate(4.5deg) skewX(2.5deg);
      }
      75% {
        transform: rotate(-3deg) skewX(-1.5deg);
      }
    }

    /* Coordinated shadow expanding, contracting, and shifting with float */
    @keyframes variedShadow {
      0%, 100% {
        transform: translate(0px, 0px) scale(1, 1);
        opacity: 0.28;
      }
      18% {
        transform: translate(4px, 0px) scale(0.85, 0.85);
        opacity: 0.18;
      }
      35% {
        transform: translate(-4px, 0px) scale(0.72, 0.75);
        opacity: 0.12;
      }
      52% {
        transform: translate(6px, 0px) scale(0.88, 0.88);
        opacity: 0.20;
      }
      70% {
        transform: translate(-5px, 0px) scale(0.76, 0.78);
        opacity: 0.14;
      }
      88% {
        transform: translate(2px, 0px) scale(0.94, 0.94);
        opacity: 0.24;
      }
    }

    /* Natural floating arm gesture adjustments */
    @keyframes leftArmFloat {
      0%, 100% {
        transform: rotate(0deg) translate(0px, 0px);
      }
      35% {
        transform: rotate(-6deg) translate(-2px, -4px);
      }
      70% {
        transform: rotate(5deg) translate(2px, 2px);
      }
    }

    @keyframes rightArmFloat {
      0%, 100% {
        transform: rotate(0deg) translate(0px, 0px);
      }
      35% {
        transform: rotate(6deg) translate(2px, -4px);
      }
      70% {
        transform: rotate(-5deg) translate(-2px, 2px);
      }
    }

    /* Aura glow pulsation */
    @keyframes auraPulse {
      0%, 100% {
        transform: scale(0.92);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.12);
        opacity: 0.85;
      }
    }

    /* Sparkles */
    @keyframes sparkleTwinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.5) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.2) rotate(45deg);
      }
    }

    /* DYNAMIC EYE EXPRESSION CYCLES (10s Master Timeline) */
    /* State 1 (0% - 28%): Peaceful Zen Eyes with gentle blink */
    /* State 2 (30% - 55%): Big Happy Open Big Eyes looking around happily */
    /* State 3 (58% - 75%): Cheerful Playful Winking Eye */
    /* State 4 (78% - 98%): Content Crescent Smile Eyes, returning to Zen */

    @keyframes zenEyesAnim {
      0%, 26% {
        opacity: 1;
        visibility: visible;
      }
      27%, 97% {
        opacity: 0;
        visibility: hidden;
      }
      98%, 100% {
        opacity: 1;
        visibility: visible;
      }
    }

    @keyframes naturalBlinkZen {
      0%, 12%, 16%, 26% {
        transform: scaleY(1);
      }
      14% {
        transform: scaleY(0.1);
      }
    }

    @keyframes happyOpenEyesAnim {
      0%, 28% {
        opacity: 0;
        visibility: hidden;
      }
      30%, 55% {
        opacity: 1;
        visibility: visible;
      }
      57%, 100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Eyeball gaze movement while open */
    @keyframes gazeShift {
      30%, 34% {
        transform: translate(0px, 0px);
      }
      38%, 46% {
        transform: translate(4px, -1px);
      }
      49%, 55% {
        transform: translate(-3px, -2px);
      }
    }

    @keyframes winkEyesAnim {
      0%, 56% {
        opacity: 0;
        visibility: hidden;
      }
      58%, 76% {
        opacity: 1;
        visibility: visible;
      }
      78%, 100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes joyfulCrescentsAnim {
      0%, 77% {
        opacity: 0;
        visibility: hidden;
      }
      79%, 96% {
        opacity: 1;
        visibility: visible;
      }
      98%, 100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Dynamic Mouth expressions matching the eyes */
    @keyframes mouthExpressionShift {
      0%, 28% {
        /* Gentle serene smile */
        d: path("M191 242 Q200 252 209 242");
      }
      30%, 55% {
        /* Open happy "D" smile */
        d: path("M188 238 Q200 260 212 238 Z");
      }
      58%, 76% {
        /* Playful cute side smirk */
        d: path("M190 241 Q202 254 214 240");
      }
      79%, 96% {
        /* Wide warm beaming curve */
        d: path("M187 240 Q200 257 213 240");
      }
      98%, 100% {
        d: path("M191 242 Q200 252 209 242");
      }
    }

    /* Blush pulse when smiling/winking */
    @keyframes blushPulse {
      0%, 28% {
        transform: scale(1);
        opacity: 0.75;
      }
      30%, 76% {
        transform: scale(1.2);
        opacity: 0.95;
      }
      78%, 100% {
        transform: scale(1);
        opacity: 0.75;
      }
    }

    /* Class bindings */
    .mascot-container {
      transform-origin: 200px 320px;
      animation: variedFloat 8s ease-in-out infinite;
    }
    .mascot-body-scale {
      transform-origin: 200px 240px;
      animation: organicBreatheAndSquash 8s ease-in-out infinite;
    }
    .mascot-shadow {
      transform-origin: 200px 395px;
      animation: variedShadow 8s ease-in-out infinite;
    }
    .drop-tip {
      transform-origin: 200px 140px;
      animation: tipWobble 7s ease-in-out infinite;
    }
    .arm-left {
      transform-origin: 125px 235px;
      animation: leftArmFloat 8s ease-in-out infinite;
    }
    .arm-right {
      transform-origin: 275px 235px;
      animation: rightArmFloat 8s ease-in-out infinite;
    }
    .pulse-aura {
      transform-origin: 200px 220px;
      animation: auraPulse 4s ease-in-out infinite;
    }

    .expr-zen {
      transform-origin: 200px 225px;
      animation: zenEyesAnim 10s infinite, naturalBlinkZen 10s infinite;
    }
    .expr-happy-open {
      animation: happyOpenEyesAnim 10s infinite;
    }
    .gaze-target {
      animation: gazeShift 10s ease-in-out infinite;
    }
    .expr-wink {
      animation: winkEyesAnim 10s infinite;
    }
    .expr-joyful-crescent {
      animation: joyfulCrescentsAnim 10s infinite;
    }
    .blush-cheeks {
      transform-origin: 200px 245px;
      animation: blushPulse 10s ease-in-out infinite;
    }
    .dynamic-mouth {
      animation: mouthExpressionShift 10s ease-in-out infinite;
    }

    .sparkle-1 {
      transform-origin: 90px 140px;
      animation: sparkleTwinkle 2.8s ease-in-out infinite;
    }
    .sparkle-2 {
      transform-origin: 310px 120px;
      animation: sparkleTwinkle 3.2s ease-in-out infinite 1.1s;
    }
    .sparkle-3 {
      transform-origin: 320px 260px;
      animation: sparkleTwinkle 2.5s ease-in-out infinite 0.6s;
    }
  </style>
</defs>
