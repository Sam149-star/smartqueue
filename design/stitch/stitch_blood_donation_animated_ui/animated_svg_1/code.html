<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_5 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_5" style="display:block;"><svg class="vital-mascot-svg" height="100%" viewbox="0 0 400 450" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients & Highlights -->
<lineargradient id="dropGrad" x1="0.2" x2="0.8" y1="0" y2="1">
<stop offset="0%" stop-color="#ff2e4d"></stop>
<stop offset="55%" stop-color="#e01a3f"></stop>
<stop offset="100%" stop-color="#b00827"></stop>
</lineargradient>
<radialgradient cx="50%" cy="50%" id="glowGrad" r="50%">
<stop offset="0%" stop-color="#ff4b6b" stop-opacity="0.35"></stop>
<stop offset="100%" stop-color="#ff4b6b" stop-opacity="0"></stop>
</radialgradient>
<radialgradient cx="50%" cy="50%" id="cheekGrad" r="50%">
<stop offset="0%" stop-color="#ff859d" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#ff859d" stop-opacity="0"></stop>
</radialgradient>
<filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="8"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
<style>
      /* Base Animation Keyframes */
      @keyframes floatCycle {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-16px) rotate(1.2deg);
        }
      }

      @keyframes shadowBreathe {
        0%, 100% {
          transform: scale(1);
          opacity: 0.28;
        }
        50% {
          transform: scale(0.82);
          opacity: 0.14;
        }
      }

      @keyframes bodySquashStretch {
        0%, 100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.035, 0.965);
        }
      }

      @keyframes armLeftZen {
        0%, 100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-4deg) translateY(-2px);
        }
      }

      @keyframes armRightZen {
        0%, 100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(4deg) translateY(-2px);
        }
      }

      @keyframes eyeBlink {
        0%, 46%, 50%, 96%, 100% {
          transform: scaleY(1);
        }
        48%, 98% {
          transform: scaleY(0.1);
        }
      }

      @keyframes auraPulse {
        0%, 100% {
          transform: scale(0.92);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.85;
        }
      }

      @keyframes sparkleTwinkle {
        0%, 100% {
          opacity: 0.2;
          transform: scale(0.6) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.2) rotate(45deg);
        }
      }

      /* Hierarchy Application */
      .mascot-container {
        transform-origin: 200px 320px;
        animation: floatCycle 4s ease-in-out infinite;
      }
      .mascot-shadow {
        transform-origin: 200px 395px;
        animation: shadowBreathe 4s ease-in-out infinite;
      }
      .mascot-body-scale {
        transform-origin: 200px 250px;
        animation: bodySquashStretch 4s ease-in-out infinite;
      }
      .arm-left {
        transform-origin: 125px 235px;
        animation: armLeftZen 4s ease-in-out infinite;
      }
      .arm-right {
        transform-origin: 275px 235px;
        animation: armRightZen 4s ease-in-out infinite;
      }
      .zen-eyes {
        transform-origin: 200px 222px;
        animation: eyeBlink 5s infinite;
      }
      .pulse-aura {
        transform-origin: 200px 220px;
        animation: auraPulse 3.5s ease-in-out infinite;
      }
      .sparkle-1 {
        transform-origin: 90px 140px;
        animation: sparkleTwinkle 2.8s ease-in-out infinite;
      }
      .sparkle-2 {
        transform-origin: 310px 120px;
        animation: sparkleTwinkle 3.2s ease-in-out infinite 1.1s;
      }
      .sparkle-3 {
        transform-origin: 320px 260px;
        animation: sparkleTwinkle 2.5s ease-in-out infinite 0.6s;
      }
    </style>
</defs>
<!-- Calming Zen Ambient Particles / Twinkles -->
<g class="sparkle-1">
<path d="M90 130 Q90 140 80 140 Q90 140 90 150 Q90 140 100 140 Q90 140 90 130 Z" fill="#ff708a"></path>
</g>
<g class="sparkle-2">
<path d="M310 110 Q310 120 300 120 Q310 120 310 130 Q310 120 320 120 Q310 120 310 110 Z" fill="#ff4d6d"></path>
</g>
<g class="sparkle-3">
<path d="M320 252 Q320 260 312 260 Q320 260 320 268 Q320 260 328 260 Q320 260 320 252 Z" fill="#ffa3b5"></path>
</g>
<!-- Ambient Glow Behind Mascot -->
<circle class="pulse-aura" cx="200" cy="220" fill="url(#glowGrad)" r="130"></circle>
<!-- Dynamic Grounding Shadow -->
<ellipse class="mascot-shadow" cx="200" cy="395" fill="#2d0b13" rx="55" ry="12"></ellipse>
<!-- Floating Mascot Group -->
<g class="mascot-container">
<g class="mascot-body-scale">
<!-- Left Meditating Arm (holding Chin Mudra / OK ring gesture) -->
<g class="arm-left">
<!-- Arm path -->

<!-- Mudra fingers -->
<circle cx="91" cy="209" fill="#fff" r="6" stroke="#22181c" stroke-width="6"></circle>
<path d="M82 201 C76 195 72 186 78 184 C84 182 88 191 88 198" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="6"></path>
<path d="M96 200 C98 192 101 185 107 188 C112 191 109 200 102 205" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="5.5"></path>
</g>
<!-- Right Meditating Arm (holding Chin Mudra) -->
<g class="arm-right">
<!-- Arm path -->
<path d="M264 242 C290 252 314 238 322 222 C327 212 321 198 310 200 C304 201 300 207 303 214" fill="none" stroke="#22181c" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5"></path>
<!-- Mudra fingers -->
<circle cx="309" cy="209" fill="#fff" r="6" stroke="#22181c" stroke-width="6"></circle>
<path d="M318 201 C324 195 328 186 322 184 C316 182 312 191 312 198" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="6"></path>
<path d="M304 200 C302 192 299 185 293 188 C288 191 291 200 298 205" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="5.5"></path>
</g>
<!-- Meditating Lotus Legs (Crossed) -->
<g class="legs-lotus">
<!-- Left folded leg -->
<path d="M174 316 C174 340 188 350 200 350 C207 350 213 342 208 335 C202 328 192 328 188 322" fill="none" stroke="#22181c" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5"></path>
<!-- Right folded leg tucked -->
<path d="M226 316 C226 340 212 350 200 350 C193 350 188 343 192 336 C197 329 207 328 212 322" fill="none" stroke="#22181c" stroke-linecap="round" stroke-linejoin="round" stroke-width="7.5"></path>
<!-- Feet resting pads -->
<ellipse cx="199" cy="344" fill="#22181c" rx="5" ry="7"></ellipse>
</g>
<!-- Blood Drop Body -->
<path d="M200 58 
               C212 85 240 135 268 182
               C296 230 290 286 258 316
               C226 346 174 346 142 316
               C110 286 104 230 132 182
               C160 135 188 85 200 58 Z" fill="url(#dropGrad)"></path>
<!-- Smooth Inner Rim Glow & Depth Highlight -->
<path d="M200 66 
               C211 92 237 138 263 183
               C287 225 281 278 252 307
               C224 334 176 334 148 307
               C119 278 113 225 137 183
               C163 138 189 92 200 66 Z" fill="none" opacity="0.6" stroke="#ff5c77" stroke-width="3"></path>
<!-- Iconic Glossy Specular Highlights -->
<!-- Big top gloss -->
<path d="M172 112 C163 126 156 142 153 158 C151 167 156 174 163 172 C170 170 174 162 176 154 C179 140 186 128 193 118 C197 112 192 106 186 107 C180 108 175 109 172 112 Z" fill="#ffffff" opacity="0.92"></path>
<!-- Small secondary dot gloss -->
<ellipse cx="147" cy="180" fill="#ffffff" opacity="0.9" rx="6" ry="11" transform="rotate(-18 147 180)"></ellipse>
<!-- Face Expressions (Zen Meditating with Peaceful Eyes, Rosy Cheeks, Sweet Smile) -->
<g id="mascot-face">
<!-- Rosy Blush Cheeks -->
<circle cx="158" cy="245" fill="url(#cheekGrad)" r="14"></circle>
<circle cx="242" cy="245" fill="url(#cheekGrad)" r="14"></circle>
<!-- Eyes Group (Peaceful Curved Lashes with Organic Blink) -->
<g class="zen-eyes">
<!-- Left Closed Zen Eye -->
<path d="M152 225 C160 234 172 234 180 225" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="6.5"></path>
<!-- Right Closed Zen Eye -->
<path d="M220 225 C228 234 240 234 248 225" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="6.5"></path>
</g>
<!-- Gentle Gentle Smile -->
<path d="M190 240 Q200 252 210 240" fill="none" stroke="#22181c" stroke-linecap="round" stroke-width="6"></path>
</g>
</g>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_5 -->
</body>
</html>
